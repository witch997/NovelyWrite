[package]
name = "novelywrite"
version = "0.7.0"
description = "NovelyWrite AI 写作工作台（Tauri 壳）"
authors = ["NovelyWrite"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
